<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mavurnek</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #12001a;
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #eee;
    }

    .container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .centered {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    h2 {
      text-align: center;
      margin: 12px 0 20px 0;
      color: #fff;
      font-size: 22px;
      letter-spacing: 1px;
    }

    input, button {
      padding: 12px;
      margin: 6px 0;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      transition: 0.3s;
    }

    input {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      width: 240px;
      backdrop-filter: blur(6px);
    }

    input::placeholder {
      color: #bbb;
    }

    input:focus {
      border: 1px solid #9d4edd;
      box-shadow: 0 0 6px #9d4edd;
    }

    button {
      background: linear-gradient(135deg, #9d4edd, #7b2cbf);
      color: white;
      cursor: pointer;
      font-weight: bold;
      width: 260px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.3);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0,0,0,0.4);
    }

    #chat {
      display: none;
      flex-direction: column;
      flex: 1;
      padding: 20px;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(8px);
      box-shadow: inset 0 0 12px rgba(0,0,0,0.3);
    }

    .msg {
      margin: 10px 0;
      padding: 10px 14px;
      background: linear-gradient(135deg, #3c0d5a, #2a003f);
      border-radius: 16px;
      max-width: 80%;
      word-wrap: break-word;
      color: #eee;
      font-size: 14px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      animation: fadeIn 0.3s ease;
    }

    .msg.self {
      background: linear-gradient(135deg, #9d4edd, #7b2cbf);
      margin-left: auto;
      color: #fff;
    }

    .chat-controls {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .chat-controls input {
      flex: 1;
    }
    /* Scrollbar styling */
    #messages::-webkit-scrollbar {
      width: 8px;
    }
    #messages::-webkit-scrollbar-track {
      background: transparent;
    }
    #messages::-webkit-scrollbar-thumb {
      background: #7b2cbf;
      border-radius: 10px;
    }
    #messages::-webkit-scrollbar-thumb:hover {
      background: #9d4edd;
    }
  </style>
</head>
</head>
<body>
  <div class="container">
    <div id="login-screen">
      <h2>Login</h2>
      <input id="username" placeholder="username" />
      <input id="extra" placeholder="extra code (if required)" />
      <button id="loginBtn">Log in</button>
      <div id="loginError" style="color:#f88"></div>
    </div>

    <div id="chat-screen" style="display:none;">
      <h2>Messaging</h2>
      <div id="messages" style="height:50vh; overflow:auto; background:rgba(255,255,255,0.04); padding:12px; border-radius:10px;"></div>
      <div style="display:flex; gap:8px; margin-top:12px;">
        <input id="message" placeholder="Type..." style="flex:1" />
        <button id="sendBtn">Send</button>
      </div>
    </div>
  </div>

<script>
// minimal sanitizer for DOM insertion
function sanitize(str) {
  return String(str).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function login() {
  const username = document.getElementById("username").value.trim();
  const extra = document.getElementById("extra").value.trim();
  if (!username) { showLoginError("Enter username"); return; }

  try {
    const res = await fetch("/api/auth", {
      method: "POST",
      credentials: "include", // important: allow server-set HttpOnly cookie to be used
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, extraCode: extra })
    });
    const data = await res.json();
    if (!res.ok) { showLoginError(data.error || "Login failed"); return; }
    enterChat();
  } catch (err) {
    showLoginError("Network error");
    console.error(err);
  }
}

function showLoginError(msg) {
  document.getElementById("loginError").textContent = msg;
}

async function enterChat() {
  document.getElementById("login-screen").style.display = "none";
  document.getElementById("chat-screen").style.display = "block";
  await fetchMessages();
}

// render messages
function renderMessages(messages) {
  const container = document.getElementById("messages");
  container.innerHTML = "";
  messages.forEach(m => {
    const d = document.createElement("div");
    d.className = "msg";
    // simple self detection (server prepended username)
    // don't assume username is available client-side; just mark lines that start with entered username
    const username = document.getElementById("username")?.value || "";
    if (m.startsWith(username + ":")) d.classList.add("self");
    d.innerHTML = sanitize(m);
    container.appendChild(d);
  });
  container.scrollTop = container.scrollHeight;
}

async function fetchMessages() {
  try {
    const res = await fetch("/api/messages", { credentials: "include" });
    if (!res.ok) { console.error("Failed to fetch messages", res.status); return; }
    const data = await res.json();
    if (!Array.isArray(data)) return;
    renderMessages(data);
  } catch (err) {
    console.error("fetchMessages error", err);
  }
}

async function sendMessage() {
  const msgEl = document.getElementById("message");
  const text = msgEl.value.trim();
  if (!text) return;
  try {
    const res = await fetch("/api/messages", {
      method: "POST",
      credentials: "include",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text })
    });
    if (!res.ok) {
      console.error("send failed", await res.text());
    }
    msgEl.value = "";
    await fetchMessages();
  } catch (err) {
    console.error("send error", err);
  }
}

document.getElementById("loginBtn").addEventListener("click", login);
document.getElementById("sendBtn").addEventListener("click", sendMessage);
setInterval(fetchMessages, 3000);
</script>
</body>
</html>
