<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mavurnek</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #12001a;
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #eee;
    }

    .container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .centered {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    h2 {
      text-align: center;
      margin: 12px 0 20px 0;
      color: #fff;
      font-size: 22px;
      letter-spacing: 1px;
    }

    input, button {
      padding: 12px;
      margin: 6px 0;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      transition: 0.3s;
    }

    input {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      width: 240px;
      backdrop-filter: blur(6px);
    }

    input::placeholder {
      color: #bbb;
    }

    input:focus {
      border: 1px solid #9d4edd;
      box-shadow: 0 0 6px #9d4edd;
    }

    button {
      background: linear-gradient(135deg, #9d4edd, #7b2cbf);
      color: white;
      cursor: pointer;
      font-weight: bold;
      width: 260px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.3);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0,0,0,0.4);
    }

    #chat {
      display: none;
      flex-direction: column;
      flex: 1;
      padding: 20px;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(8px);
      box-shadow: inset 0 0 12px rgba(0,0,0,0.3);
    }

    .msg {
      margin: 10px 0;
      padding: 10px 14px;
      background: linear-gradient(135deg, #3c0d5a, #2a003f);
      border-radius: 16px;
      max-width: 80%;
      word-wrap: break-word;
      color: #eee;
      font-size: 14px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      animation: fadeIn 0.3s ease;
    }

    .msg.self {
      background: linear-gradient(135deg, #9d4edd, #7b2cbf);
      margin-left: auto;
      color: #fff;
    }

    .chat-controls {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .chat-controls input {
      flex: 1;
    }
    /* Scrollbar styling */
    #messages::-webkit-scrollbar {
      width: 8px;
    }
    #messages::-webkit-scrollbar-track {
      background: transparent;
    }
    #messages::-webkit-scrollbar-thumb {
      background: #7b2cbf;
      border-radius: 10px;
    }
    #messages::-webkit-scrollbar-thumb:hover {
      background: #9d4edd;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Lock screen -->
    <div id="lock-screen" class="centered">
      <h2>Enter a word.</h2>
      <input type="password" id="code" placeholder="Word..." />
      <button onclick="checkCode()">Get word data.</button>
    </div>

    <!-- Username selection -->
    <div id="username-screen" class="centered" style="display:none;">
      <h2>👤 Choose Username</h2>
      <input type="text" id="username" placeholder="Your username" />
      <button onclick="enterChat()">Enter Chat</button>
    </div>

    <!-- Chat screen -->
    <div id="chat">
      <h2>💬 Messaging</h2>
      <div id="messages"></div>
      <div class="chat-controls">
        <input type="text" id="message" placeholder="Type a message..." />
        <button onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>
  <script>
// SHA-256 helper
async function sha256(message) {
  const msgBuffer = new TextEncoder().encode(message);
  const hashBuffer = await crypto.subtle.digest("SHA-256", msgBuffer);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

/* ------------------------------
   🔐 HASHES (à remplacer)
--------------------------------*/
const correctHash = "4bfcf30dce1c031d6577fc579b9736833f847603e5d313b200b458a7e0f92954";

// USERNAMES autorisés (hashés)
const hashUserX = "c16b0e1dc4fde45a6d70be9c578741ab37f63e71041665e3379efde76d55902f"; // <--- hash username X
const hashUserY = "47dd51c046721c58b7bcbdecb3a8ac1e0be029e5328982d590309aaebcff16d6"; // <--- hash username Y

// EXTRA CODES (pour X et Y)
const hashExtraCodeForX = "b290a91ee1239e99705fb55a538f2320dc6ef8b27761ba1e261d75319e7d5d4e";
const hashExtraCodeForY = "91e6602efc58f04d864f195b893c7e76497d71e4b80830f9eab5364ffa43e0cd";

/* ------------------------------
   🔐 PREMIÈRE VÉRIFICATION DU MOT
--------------------------------*/
async function checkCode() {
  const input = document.getElementById("code").value;
  const hash = await sha256(input);
  if (hash === correctHash) {
    document.getElementById("lock-screen").style.display = "none";
    document.getElementById("username-screen").style.display = "flex";
  } else {
    alert("Error while fetching data!");
  }
}

let currentUser = "";
let allMessages = [];

/* ------------------------------
   🔐 CHECK DU USERNAME + EXTRA CODE
--------------------------------*/
async function enterChat() {
  const user = document.getElementById("username").value.trim();
  if (!user) {
    alert("Please enter a username");
    return;
  }

  const userHash = await sha256(user);

  // ❌ utilisateur non autorisé
  if (userHash !== hashUserX && userHash !== hashUserY) {
    alert("Access denied.");
    return;
  }

  // 🔒 demande code supplémentaire si User X
  if (userHash === hashUserX) {
    const extra = prompt("Enter extra code for User X:");
    if (!extra) { alert("Access denied."); return; }

    const extraHash = await sha256(extra);
    if (extraHash !== hashExtraCodeForX) {
      alert("Wrong extra code.");
      return;
    }
  }

  // 🔒 demande code supplémentaire si User Y
  if (userHash === hashUserY) {
    const extra = prompt("Enter extra code for User Y:");
    if (!extra) { alert("Access denied."); return; }

    const extraHash = await sha256(extra);
    if (extraHash !== hashExtraCodeForY) {
      alert("Wrong extra code.");
      return;
    }
  }

  // 🎉 OK → accès au chat
  currentUser = user;
  document.getElementById("username-screen").style.display = "none";
  document.getElementById("chat").style.display = "flex";
  fetchMessages();
}

/* ------------------------------
   CHAT SYSTEM (inchangé)
--------------------------------*/
function renderMessages() {
  const messagesDiv = document.getElementById("messages");
  messagesDiv.innerHTML = "";
  allMessages.forEach(line => {
    if (line.trim()) {
      const msgDiv = document.createElement("div");
      msgDiv.className = "msg";
      if (line.startsWith(currentUser + ":")) {
        msgDiv.classList.add("self");
      }
      msgDiv.textContent = line;
      messagesDiv.appendChild(msgDiv);
    }
  });
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

async function fetchMessages() {
  try {
    const res = await fetch("/api/messages");
    if (!res.ok) throw new Error("Server error: " + res.status);

    const data = await res.json();
    if (!Array.isArray(data)) throw new Error("API did not return an array");

    allMessages = data;
    renderMessages();
  } catch (err) {
    console.error("Failed to fetch messages:", err);
  }
}

async function sendMessage() {
  const msgInput = document.getElementById("message");
  const msg = msgInput.value.trim();
  if (!msg) return;

  const entry = currentUser + ": " + msg;

  await fetch("/api/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message: entry })
  });

  msgInput.value = "";
  fetchMessages();
}

setInterval(fetchMessages, 3000);
</script>
</body>
</html>
